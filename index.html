<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The ROOMS</title>
<link rel="icon" href="index.icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
<style>
/* one full-screen canvas; a quiet loading card on black while the game downloads */
:root { --bg: #050505; --ink: #ece6d8; --dim: #8a847a; --warn: #ff5a48; --bar: #f2d966; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none; margin: 0; }
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); text-align: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#logo { width: min(420px, 86vw); height: auto; }
#status h1 { margin: 0; font-size: clamp(28px, 7vw, 46px); letter-spacing: 0.04em; font-weight: 800; text-wrap: balance; }
#status .warn { color: var(--warn); font-weight: 700; font-size: 15px; letter-spacing: 0.03em; }
#status .note { color: var(--dim); font-size: 13px; max-width: 34em; }
#bar { width: min(320px, 80vw); height: 6px; background: #1c1b18; border-radius: 3px; overflow: hidden; }
#bar > div { width: 0%; height: 100%; background: var(--bar); transition: width .2s; }
#pct { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
#err { color: var(--warn); font-size: 14px; max-width: 34em; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<div id="status">
  <img id="logo" src="logo.png" alt="The ROOMS" width="900" height="344">
  <div class="warn">THIS USES DOORS AND ROOMS REVISITED ASSETS!</div>
  <div id="bar"><div></div></div>
  <div id="pct">loading 0%</div>
  <div id="err" hidden></div>
  <div class="note">unofficial fan game. credit: the doors team and the rooms: revisited team. not affiliated with roblox. the first load is about 70 mb, best on wifi.</div>
</div>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":24040368,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const engine = new Engine(GODOT_CONFIG);
(function () {
  const status = document.getElementById("status");
  const fill = document.querySelector("#bar > div");
  const pct = document.getElementById("pct");
  const err = document.getElementById("err");
  const fail = (e) => { console.error(e); err.hidden = false; err.textContent = "couldn't start: " + (e && e.message ? e.message : e); };
  let last = Date.now();
  const watch = setInterval(() => {
    if (!document.body.contains(status)) { clearInterval(watch); return; }
    if (Date.now() - last > 45000) { err.hidden = false; err.textContent = "still loading... if it stays stuck, close this and open it again."; }
  }, 5000);
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail(new Error("this browser is missing: " + missing.join(", "))); return; }
  engine.startGame({
    onProgress: (cur, total) => {
      last = Date.now();
      if (cur > 0 && total > 0) { const p = Math.min(100, Math.round(cur / total * 100)); fill.style.width = p + "%"; pct.textContent = "loading " + p + "%"; }
    },
  }).then(() => status.remove(), fail);
}());
</script>
</body>
</html>
